name: Build GooseCalc APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake g++ make libssl-dev gettext-base

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r27b" >> $GITHUB_ENV

      - name: Install Android SDK platform (system SDK)
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-29" > /dev/null 2>&1 || true
          # Also accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true

      - name: Download prebuilt Goose compiler
        run: |
          wget -q https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz
          tar -xzf goose-v2026.4-linux-x64.tar.gz
          GOOSE_PATH=$(find . -name goose -type f -executable 2>/dev/null | head -1)
          echo "Found goose at: $GOOSE_PATH"
          chmod +x "$GOOSE_PATH"
          echo "GOOSE_BIN=$PWD/$GOOSE_PATH" >> $GITHUB_ENV
          echo "PATH=$PWD/$(dirname "$GOOSE_PATH"):$PATH" >> $GITHUB_ENV
          "$GOOSE_PATH" version

      - name: Build GooseCalc APK
        env:
          NDK: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          OS_NAME: linux-x86_64
          GOOSE: ${{ env.GOOSE_BIN }}
        run: |
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          make clean
          make CC_ARM64="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: goosecalc.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
